name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["web/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["web/**"]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[ci]"

      - name: "Ruff: lint"
        run: ruff check src/ tests/ search/ search_service/

      - name: "Ruff: format check"
        run: ruff format --check src/ tests/ search/ search_service/

      - name: Pytest
        env:
          # Dummy values so db.client doesn't raise EnvironmentError at import.
          # Tests mock all actual Supabase calls.
          SUPABASE_URL: "https://dummy.supabase.co"
          SUPABASE_KEY: "dummy-anon-key"
          SUPABASE_SERVICE_KEY: "dummy-service-key"
        run: pytest tests/ -v --tb=short

  # The search service and the search code it runs, on the libraries of the
  # service's image: its lock, hashes and all. The job above skips the
  # service's HTTP tests, since the main environment has no FastAPI, and runs
  # numpy 1 where the image runs numpy 2.
  search-service:
    name: Search service (the image's libraries)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: search_service/requirements.lock

      - name: Install the image's libraries
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r search_service/requirements.lock
          pip install "pytest>=7.4,<9.0" "tokenizers>=0.20,<1.0"

      - name: Pytest
        run: pytest tests/search tests/search_service -v --tb=short
