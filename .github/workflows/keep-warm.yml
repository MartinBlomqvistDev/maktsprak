name: Keep inference warm

# The inference service scales to zero, so the first prediction after an idle
# spell pays a cold start: measured at 26 seconds against 0.2 warm. This knocks on
# the door through the site's own proxy, so that a visitor is less often the one
# who wakes it.
#
# It does not keep the service warm. GitHub runs scheduled workflows on a best
# effort basis, and in November 2026 this one ran two to five times a day
# against the 288 its schedule asks for. A cold start is therefore the normal
# case for the first visitor, and the cold-start hint in PredictDemo is what
# covers it.
#
# The search service behind /fraga is not pinged from here. Cloud Scheduler asks
# its /health every five minutes, as step 8 of search_service/DEPLOY.md sets up.
#
# Deliberately goes via maktsprak.se rather than the Cloud Run URL directly: that
# URL is only known to the Vercel environment, and putting it in a public workflow
# would expose /predict to anyone who reads this file.
#
# Cost is negligible. Each ping is one short prediction. Even if every scheduled
# run happened, it would be about 8,600 requests and 2,600 vCPU-seconds a month,
# against Cloud Run's always-free tier of 2M requests and 180,000 vCPU-seconds.

on:
  schedule:
    # Every 5 minutes, around the clock, which is GitHub's shortest interval. The
    # scheduler skips most of these runs (see above), and a narrower window would
    # be skipped as easily. Public repos get unlimited Actions minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never let two pings overlap, and never queue them up behind a slow cold start.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # One step of at most 90 seconds, with room for the runner itself.
    timeout-minutes: 3
    steps:
      - name: Warm the model
        run: |
          start=$(date +%s)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            -X POST https://maktsprak.se/api/predict \
            -H 'Content-Type: application/json' \
            -d '{"text":"Uppvärmning av inferenstjänsten."}' || echo "000")
          echo "predict -> HTTP $code in $(( $(date +%s) - start ))s"
          # A cold start can outrun the timeout, and the site being briefly
          # unreachable is not something to wake anyone over. Warn, do not fail:
          # a red X on this workflow would be noise, not signal.
          #
          # The `|| echo "000"` is what makes that possible. The step runs under
          # `bash -e`, so a curl that times out (exit 28) would take the whole
          # step down on the assignment line, before this guard could ever run.
          # 000 is also what curl reports when no response arrived, so the
          # warning below stays truthful.
          if [ "$code" != "200" ]; then
            echo "::warning::keep-warm got HTTP $code"
          fi
