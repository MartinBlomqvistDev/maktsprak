    text: "Vilka argument har förts fram mot vinster i friskolor?"
  - id: nato
    text: "Vad har sagts om att Sverige ska gå med i Nato?"
  - id: betyg
    text: "Ska barn få betyg tidigare i skolan?"
  - id: skjutningar
    text: "Hur ska skjutningarna i Sverige stoppas?"
  - id: apoteksmonopolet
    text: "Vad har sagts om att avskaffa apoteksmonopolet?"
  - id: formogenhetsskatten
    text: "Vad har sagts om att avskaffa förmögenhetsskatten?"
  - id: manlandningen
    text: "Vad sa riksdagen om månlandningen 1969?"
