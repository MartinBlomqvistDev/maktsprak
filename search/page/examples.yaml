# The example questions on the page Fråga protokollet, in the order the page
# shows them. None is taken from a question set of the evaluation. Step 15
# answers each once with the chain the page runs, and once under each party for
# the view with eight parties. The last one asks about an event before the
# corpus, so it shows how the page abstains.
questions:
