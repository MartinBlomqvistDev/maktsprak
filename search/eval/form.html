<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__HEADING__</title>
<style>
:root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a65; --line: #dedbd2; --accent: #2f5d50; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1c1a; --fg: #ecebe6; --muted: #a3a29b; --line: #3a3b37; --accent: #8cc2b0; }
}
body { background: var(--bg); color: var(--fg); font: 16px/1.55 Georgia, serif; margin: 0; }
main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 6rem; }
h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
.intro { color: var(--muted); }
article { border-top: 1px solid var(--line); padding: 1.25rem 0; }
.meta { color: var(--muted); font: 13px/1.4 system-ui, sans-serif; }
.question { font-size: 1.15rem; font-weight: bold; margin: .4rem 0 .8rem; }
blockquote { margin: 0 0 1rem; padding-left: 1rem; border-left: 3px solid var(--line); }
blockquote p { margin: 0 0 .6rem; }
fieldset { border: 0; padding: 0; margin: .3rem 0; font: 15px system-ui, sans-serif; }
legend { font-weight: bold; padding: 0; margin-bottom: .2rem; }
label { margin-right: 1rem; }
textarea {
  width: 100%; box-sizing: border-box; margin-top: .4rem; font: 14px system-ui, sans-serif;
}
.bar {
  position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: .75rem; align-items: center;
  padding: .6rem 1rem; background: var(--bg); border-top: 1px solid var(--line);
  font: 14px system-ui, sans-serif;
}
button {
  font: inherit; padding: .4rem .8rem; border: 1px solid var(--accent); border-radius: 4px;
  background: none; color: var(--accent); cursor: pointer;
}
#status { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>__HEADING__: __COUNT__</h1>
<p class="intro">__INTRO__</p>
__ARTICLES__
</main>
<div class="bar">
<button type="button" id="copy">Kopiera svaren</button>
<button type="button" id="save">Ladda ned svaren</button>
<span id="status"></span>
</div>
<script>
const ITEMS = __ITEMS__;
const KEY = __KEY__;
const FIELDS = __FIELDS__;
function box(item, field, value) {
  const name = `${item}:${field}`;
  const found = document.getElementsByName(name);
  return Array.from(found).find((input) => value === undefined ? input.checked : input.value === value);
}
function collect() {
  const answers = [];
  let done = 0;
  for (const item of ITEMS) {
    const entry = {question_id: item};
    let complete = true;
    for (const field of FIELDS) {
      const chosen = box(item, field.name);
      entry[field.name] = chosen ? field.parse(chosen.value) : null;
      if (!chosen) complete = false;
    }
    entry.comment = document.getElementsByName(`${item}:comment`)[0].value;
    if (complete) done += 1;
    answers.push(entry);
  }
  return {answers, done};
}
function show() {
  const {done} = collect();
  document.getElementById("status").textContent = `${done} av ${ITEMS.length} besvarade`;
}
function store() {
  try { localStorage.setItem(KEY, JSON.stringify(collect().answers)); } catch (error) {}
  show();
}
function restore() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (error) {}
  if (!saved) return;
  for (const entry of saved) {
    for (const field of FIELDS) {
      const value = entry[field.name];
      if (value === null || value === undefined) continue;
      const chosen = box(entry.question_id, field.name, String(value));
      if (chosen) chosen.checked = true;
    }
    const note = document.getElementsByName(`${entry.question_id}:comment`)[0];
    if (note) note.value = entry.comment || "";
  }
}
function payload() {
  const {answers, done} = collect();
  const question = `Bara ${done} av ${ITEMS.length} är besvarade. Fortsätta ändå?`;
  if (done < ITEMS.length && !confirm(question)) return null;
  return JSON.stringify({form: KEY, answers}, null, 1);
}
document.addEventListener("change", store);
document.addEventListener("input", store);
document.getElementById("copy").addEventListener("click", async () => {
  const text = payload();
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    document.getElementById("status").textContent = "Svaren är kopierade";
  } catch (error) {
    prompt("Kopiera texten nedan:", text);
  }
});
document.getElementById("save").addEventListener("click", () => {
  const text = payload();
  if (!text) return;
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
  link.download = KEY + ".json";
  link.click();
});
restore();
show();
</script>
</body>
</html>
