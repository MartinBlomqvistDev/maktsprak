# Settings for search/. Read by search/config.py, which rejects unknown keys.

# The Riksdag's speech datasets, one zip per parliamentary session. The file
# for a session is named after its label without the slash: 2002/03 is 200203.
source:
  dataset_url: https://data.riksdagen.se/dataset/anforande/anforande-{session}.json.zip
  first_session: "2002/03"
  last_session: "2026/27"

# The sessions the corpus covers, from first_session to source.last_session.
# 2002/03 is fetched and counted, and left out: its text is broken at the width
# of the printed column, with no mark for where a paragraph ends. The decision
# is the addendum of 2026-11-20 in docs/search/PREREGISTRATION.md.
corpus:
  first_session: "2003/04"

# Bulk data, gitignored. These paths resolve against the data root: the
# repository root, or MAKTSPRAK_DATA_ROOT when it is set. In a git worktree,
# point it at the main checkout, where the corpus is.
data:
  raw_anforanden: data/raw_anforanden
  search: data/search
  legacy_corpus: data/parquet/speeches_full.parquet
  party_classifier: data/models/party_classifier

# Tracked output: results and manifests as JSON. These paths always resolve
# against the repository the code runs from.
tracked:
  reports: data/reports/search
  questions: data/reports/search/questions

# Packing speeches into passages, the unit the indexes hold. A passage is a run
# of whole paragraphs from one speech, packed towards target_words. The trial
# targets are only counted in the packing report; no files are written for them.
passages:
  target_words: 200
  trial_targets: [120, 320]

# Reconciling the speech corpus against the older corpus parsed from the
# protocol PDFs (step 03). coverage_threshold is the stop rule fixed before the
# first run: the new source must cover this share of the older speeches. Two
# speeches are the same when they share at least min_shared_tokens tokens and
# the older text holds at least min_sequence_share of the new text's pairs of
# adjacent tokens. missing_tokens and surplus_tokens are the sizes above which a
# pair counts as missing words or as carrying a surplus. The listed_* values cap
# the lists in the tracked report.
reconcile:
  coverage_threshold: 0.99
  edge_tokens: 8
  min_sequence_share: 0.6
  min_shared_tokens: 5
  missing_tokens: 5
  surplus_tokens: 20
  listed_ids: 60
  listed_deviations: 50
  listed_missing: 25
  listed_tokens: 30

# The deep-link check (check_deep_links.py). Both values are the defaults of the
# command-line options --seed and --max-requests. The 50 speeches it samples need 50
# requests, so 60 leaves room for retries.
links:
  seed: 2026
  max_requests: 60

# The question sets of the evaluation (step 10). Their sizes and the split are
# fixed in docs/search/PREREGISTRATION.md; the seeds, the rare-word share and
# the rest are recorded in the addendum that carries the sets' hashes.
#
# sizes are the generated sets drawn from passages; a filtered question is a
# natural question written from its own passage. A stem is rare when fewer than
# rare_share of all passages hold it. A slot tries at most max_passages_per_slot
# passages of its stratum. The pilot tries the prompts on pilot_sizes passages of
# its own draw, one passage per slot, for at most pilot_budget_usd. review_seed
# draws the 50 questions of the review.
questions:
  seed: 20261121
  pilot_seed: 20261120
  review_seed: 20261122
  sizes: {natural: 300, filtered: 100, stance: 50}
  pilot_sizes: {natural: 20, stance: 10}
  unanswerable: {off_topic: 50, unknown_speaker: 25, sd_before_2010: 25, after_index: 50}
  unanswerable_asked: {off_topic: 60, unknown_speaker: 35, sd_before_2010: 35, after_index: 60}
  pilot_unanswerable_asked: 8
  rare_share: 0.001
  max_passages_per_slot: 12
  interpellation_sessions_per_period: 1
  pilot_budget_usd: 1.0

# The language model that writes the questions, and the list prices used to
# account for what it costs, in US dollars per million tokens (Anthropic's list,
# as of 2026-11-03). A message batch costs batch_discount less.
generation:
  model: claude-opus-5-5
  effort: low
  max_tokens: 8000
  batch_discount: 0.5
  prices:
    claude-opus-5-5: {input: 4.0, output: 20.0}
    claude-sonnet-5-5: {input: 2.0, output: 10.0}
    claude-haiku-5-5: {input: 0.10, output: 0.50}

# The judge (step 11): the language model that grades how well a passage
# answers a question on the scale 0, 1, 2, and its calibration against Martin's
# own grades. seed draws the pilot questions of the 100 calibration pairs. The
# judge's prices are those of the generation section.
judge:
  model: claude-opus-5-5
  effort: low
  max_tokens: 4000
  seed: 20261123

# The BM25 baseline (step 12): the values of k1 and b tried with each analyzer
# on the development split, and the bootstrap behind the intervals.
baseline:
  k1: [0.6, 0.9, 1.2, 1.5, 1.8]
  b: [0.3, 0.45, 0.6, 0.75, 0.9]
  resamples: 10000
  bootstrap_seed: 20261124

# The answer step (step 14), as the addendum of 2026-11-22 in
# docs/search/PREREGISTRATION.md fixes it. The selector picks paragraphs from
# the ten passages BM25 ranks highest; on the development split BM25 runs as
# its tuning set it (data/reports/search/bm25_tuning_dev.json). The page's
# language model may cost monthly_budget_usd in a calendar month before the
# baseline answers. The rounds on the development split and the judge's grades
# of them may cost dev_budget_usd together. The model's prices are those of the
# generation section.
answer:
  model: claude-opus-5-5
  effort: low
  max_tokens: 8000
  analyzer: stem-nostop
  k1: 1.2
  b: 0.9
  monthly_budget_usd: 2.0
  dev_budget_usd: 38.0
  resamples: 10000
  bootstrap_seed: 20261125

# The vector leg and the hybrid (steps 06, 07 and 13). The candidates and the
# rules that choose between them are fixed in the addendum of 2026-11-21 in
# docs/search/PREREGISTRATION.md. The candidates are listed lightest to operate
# first, which is the order a near tie goes to: within tie_margin of the best
# recall@10, the first listed wins. The prompts are the ones each model card
# gives. A local model reads at most max_tokens of a passage. An API model is
# routed to one provider in one precision, at its listed price in US dollars per
# million input tokens as of 2026-11-21, and can win only if embedding the whole
# corpus costs at most api_budget_usd. A run through the API stops before it
# spends more than run_cap_usd unless its command line raises the cap.
#
# The subset of step A holds every gold speech of the development split and is
# filled up to subset_size passages with speeches drawn with subset_seed. Each
# ranking of the hybrid holds window passages; the RRF constant k is tuned over
# rrf_k, and a tie goes to the value nearest rrf_k_preferred.
vectors:
  candidates:
    - name: bekko-a25m
      kind: sentence_transformers
      model: hotchpotch/bekko-embedding-v1-a25m
      revision: 44f0b8af0f487acd0ccf1a7cb7ae7a29a6dfc09c
      dimension: 384
      query_prompt: ""
      document_prompt: ""
      max_tokens: 1024
      licensed: true
    - name: saga-embed
      kind: sentence_transformers
      model: SagaEmbed/saga-embed_v1
      revision: 5f5975288b821c190ab9e51134cea45516199816
      dimension: 1024
      query_prompt: "task: retrieval | query: "
      document_prompt: "title: none | text: "
      max_tokens: 512
      licensed: false
    - name: arctic-l-v2
      kind: sentence_transformers
      model: Snowflake/snowflake-arctic-embed-l-v2.0
      revision: ac6544c8a46e00af67e330e85a9028c66b8cfd9a
      dimension: 1024
      query_prompt: "query: "
      document_prompt: ""
      max_tokens: 1024
      licensed: true
    - name: qwen3-8b
      kind: openrouter
      model: qwen/qwen3-embedding-8b
      revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
      dimension: 1024
      query_prompt: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
      document_prompt: ""
      provider: nebius
      quantization: bf16
      price_per_million_usd: 0.01
      licensed: true
  tie_margin: 0.01
  api_budget_usd: 10.0
  run_cap_usd: 1.0
  subset_seed: 20261125
  subset_size: 60000
  shard_rows: 4096
  window: 1000
  rrf_k: [10, 20, 30, 60, 100]
  rrf_k_preferred: 60
  api_batch_inputs: 64
  api_concurrency: 4
